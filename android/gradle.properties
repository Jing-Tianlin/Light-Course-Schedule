org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template (AGP 9 新 DSL 兼容，勿删)
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template (AGP 9 内置 Kotlin 兼容，勿删)
android.builtInKotlin=false
# 关闭 Kotlin 增量编译：编译输入跨盘（插件源码在 C 盘 Pub 缓存、Flutter SDK 在 D 盘），
# 增量缓存的 RelocatableFileToPathConverter 做跨盘路径相对化会抛
# "this and base files have different roots"，导致 "Could not close incremental caches"
kotlin.incremental=false
# Kotlin 编译在 Gradle 守护进程内执行（不另起 Kotlin 守护进程）：
# 本机 Kotlin 守护进程与 Gradle 的通信会随机死锁，导致 :app:compileDebugKotlin 无限挂起
kotlin.compiler.execution.strategy=in-process
